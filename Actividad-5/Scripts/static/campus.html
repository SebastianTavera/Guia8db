<!doctype html>
<html lang="es" data-tema="vidrio">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus · Portal académico</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Campus — portal académico: asignaturas, inscripción, horario, notas, pagos y servicios.">
  <meta name="theme-color" content="#050506">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/campus.css">
  <script type="module" src="/static/js/campus.js"></script>
</head>
<body class="app invitado">
  <!-- Menú lateral: perfil + secciones (en el celular se abre con el botón de menú) -->
  <aside class="lateral glass" id="lateral" aria-label="Menú principal">
    <div class="perfil-lateral" id="perfil-lateral"></div>
    <nav id="nav-lateral"></nav>
    <div class="lateral-marca"><span class="marca-logo" aria-hidden="true"></span>Campus</div>
  </aside>

  <div class="principal">
    <header class="cabecera glass" id="cabecera">
      <button class="boton-vidrio boton-redondo boton-menu" type="button" id="boton-menu" aria-label="Abrir menú" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="marca" href="#/inicio" aria-label="Campus, inicio"><span class="marca-logo" aria-hidden="true"></span><span><span class="marca-texto">Campus</span><span class="marca-sub">Portal académico</span></span></a>
      <label class="selector-periodo" id="selector-periodo" hidden><b>Período académico:</b>
        <span class="selector"><select id="periodo" aria-label="Período académico"></select></span></label>
      <div class="cabecera-acciones" id="cabecera-acciones"></div>
      <nav class="nav-superior" id="nav-superior" aria-label="Menú principal"></nav>
    </header>
    <div class="banda" id="banda" hidden></div>
    <main class="vista" id="vista" aria-live="polite"></main>
    <footer class="pie-app no-imprimir">
      <span>© 2026 Campus · Portal académico · v1.0</span>
      <nav aria-label="Información"><button type="button" data-accion="ayuda">Ayuda</button><button type="button" data-accion="privacidad">Privacidad y datos</button></nav>
    </footer>
  </div>
</body>
</html>
